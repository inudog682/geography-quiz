<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>高校地理・地図クイズ</title><link rel="stylesheet" href="css/style.css"></head>
<body><header><h1>高校地理・地図クイズ</h1><p>地図を見て、地名・地理用語をタイピングで答えよう。</p></header>
<main><section class="stats"><span>問題 <b id="progress">0 / 0</b></span><span>正解 <b id="correct">0</b></span><span>正答率 <b id="rate">0%</b></span></section>
<section class="panel"><div class="map-heading"><h2>出題地図</h2><span id="category" class="tag">準備中</span></div>
<div class="map-wrap"><canvas id="map"></canvas><div id="mapMessage" class="map-message">地図を読み込んでいます…</div></div>
<p id="question" class="question">読み込み中…</p><form id="answerForm"><label for="answer">回答</label><div class="answer-row"><input id="answer" autocomplete="off" placeholder="地名・用語を入力" disabled><button id="submit" type="submit" disabled>回答する</button></div></form>
<p id="feedback" class="feedback" aria-live="polite"></p><div class="actions"><button id="next" class="secondary" disabled>次の問題へ</button><button id="showAnswer" class="secondary" disabled>正解を見る</button></div></section>
<section class="settings"><label for="mode">出題範囲</label><select id="mode"><option value="all">すべて</option><option>国境・緯度経度</option><option>水域・河川・地形</option><option>都市・首都</option><option>農業・産業・地域</option><option>歴史・文化</option></select><button id="restart" class="secondary">この範囲で最初から</button></section>
<p class="note">地図画像は assets/world-map-natural-earth.png を読み込みます。</p></main><script src="js/questions.js"></script><script src="js/main.js"></script></body></html>
